<div class="login-container">
  <!-- Header -->
  <header class="login-header">
    <div class="logo-container" (click)="goToHome()">
      <div class="logo-icon">
        <div class="logo-circle">
          <div class="logo-dot dot-1"></div>
          <div class="logo-dot dot-2"></div>
          <div class="logo-dot dot-3"></div>
        </div>
      </div>
      <span class="logo-text">vitalkey</span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="login-main">
    <div class="login-card">
      <!-- Form Side -->
      <div class="form-side">
        <h1 class="form-title">Bem-vindo de volta!</h1>
        <p class="form-description">
          Entre com seu CRM e senha para acessar sua conta.
        </p>

        <form (ngSubmit)="onSubmit()" class="login-form">
          <div class="form-group">
            <label for="crm" class="form-label">CRM</label>
            <input 
              type="text" 
              id="crm" 
              [(ngModel)]="crm" 
              (input)="onCrmInput($event)"
              name="crm"
              class="form-input crm-input"
              placeholder="123456-SP"
              pattern="[0-9]{6}-[A-Z]{2}"
              maxlength="9"
              required
            />
            <small class="form-hint">Formato: 123456-SP</small>
          </div>

          <div class="form-group">
            <label for="senha" class="form-label">Senha</label>
            <div class="password-input-wrapper">
              <input 
                [type]="showPassword ? 'text' : 'password'" 
                id="senha" 
                [(ngModel)]="senha" 
                name="senha"
                class="form-input"
                placeholder="Digite sua senha"
                required
              />
              <button 
                type="button" 
                class="password-toggle"
                (click)="togglePasswordVisibility()"
                aria-label="Mostrar/ocultar senha"
              >
                <svg [class.hidden]="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
                <svg [class.hidden]="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                </svg>
              </button>
            </div>
          </div>

          @if (errorMessage) {
            <div class="error-message">
              {{ errorMessage }}
            </div>
          }

          <button type="submit" class="submit-button">
            Entrar
          </button>
        </form>

        <p class="register-link">
          Não tem uma conta? <a (click)="goToRegister()">Cadastre-se aqui</a>
        </p>
      </div>
    </div>
  </main>

  <!-- Background Decorations -->
  <div class="bg-decoration"></div>
</div>
